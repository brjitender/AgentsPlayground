name: Validate Skills

on:
  pull_request:
    paths:
      - "agents/**"
  push:
    paths:
      - "agents/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check YAML frontmatter
        run: |
          find agents/ -name "*.md" -type f | while read file; do
            echo "Checking $file..."
            if grep -q "^---$" "$file"; then
              echo "✓ $file has YAML frontmatter"
            else
              echo "✗ $file missing YAML frontmatter"
              exit 1
            fi
          done

      - name: Verify required sections
        run: |
          find agents/ -name "*.md" -not -name "TEMPLATE.md" -type f | while read file; do
            echo "Validating $file..."
            grep -q "## " "$file" && echo "✓ $file has sections" || echo "⚠ $file may be empty"
          done

      - name: Validate YAML syntax
        run: |
          python3 -m pip install pyyaml
          python3 << 'EOF'
          import os
          import re
          import yaml

          errors = 0
          for root, dirs, files in os.walk('agents'):
              for file in files:
                  if file.endswith('.md'):
                      filepath = os.path.join(root, file)
                      with open(filepath, 'r') as f:
                          content = f.read()
                          match = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
                          if match:
                              try:
                                  yaml.safe_load(match.group(1))
                                  print(f"✓ {filepath} - YAML valid")
                              except yaml.YAMLError as e:
                                  print(f"✗ {filepath} - YAML error: {e}")
                                  errors += 1
                          else:
                              print(f"⚠ {filepath} - No YAML frontmatter")

          if errors > 0:
              exit(1)
          EOF
