name: Validate Skills

on:
  pull_request:
    paths:
      - "skills/**"
  push:
    paths:
      - "skills/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Markdown
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: agents
          config_file: .markdownlint.json

      - name: Check Markdown syntax
        run: |
          find agents/ -name "*.md" -type f | while read file; do
            echo "Checking $file..."
            grep -q "^---$" "$file" || echo "ERROR: No YAML frontmatter in $file"
          done

      - name: Verify required sections
        run: |
          find agents/ -name "*.md" -not -name "TEMPLATE.md" -type f | while read file; do
            echo "Validating $file..."
            grep -q "## Overview" "$file" || echo "ERROR: Missing Overview section"
            grep -q "## Description" "$file" || echo "WARNING: Missing Description section"
          done

      - name: Lint YAML frontmatter
        run: |
          python3 -m pip install pyyaml
          python3 << 'PYTHON'
          import os
          import re
          import yaml

          for root, dirs, files in os.walk('agents'):
              for file in files:
                  if file.endswith('.md'):
                      filepath = os.path.join(root, file)
                      with open(filepath, 'r') as f:
                          content = f.read()
                          match = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
                          if match:
                              try:
                                  yaml.safe_load(match.group(1))
                                  print(f"✓ {filepath} - YAML valid")
                              except yaml.YAMLError as e:
                                  print(f"✗ {filepath} - YAML error: {e}")
                          else:
                              print(f"⚠ {filepath} - No YAML frontmatter found")
