name: Validate Skills

on:
  pull_request:
    paths:
      - "skills/**"
  push:
    paths:
      - "skills/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown syntax
        run: |
          find skills/ -name "*.md" -type f | while read file; do
            echo "Checking $file..."
            # Basic YAML frontmatter validation
            grep -q "^---$" "$file" || echo "ERROR: No YAML frontmatter in $file"
          done
      - name: Verify required sections
        run: |
          find skills/ -name "*.md" -not -name "TEMPLATE.md" -type f | while read file; do
            echo "Validating $file..."
            grep -q "## Overview" "$file" || echo "ERROR: Missing Overview section"
            grep -q "## How It Works" "$file" || echo "ERROR: Missing How It Works section"
            grep -q "## Testing Strategy" "$file" || echo "ERROR: Missing Testing Strategy section"
          done
      - name: Lint YAML frontmatter
        run: |
          python3 -m pip install pyyaml
          python3 << 'PYTHON'
          import os
          import re
          import yaml

          for root, dirs, files in os.walk('skills'):
              for file in files:
                  if file.endswith('.md') and file != 'TEMPLATE.md':
                      filepath = os.path.join(root, file)
                      with open(filepath, 'r') as f:
                          content = f.read()
                          match = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
                          if match:
                              try:
                                  yaml.safe_load(match.group(1))
                                  print(f"✓ {filepath} - YAML valid")
                              except yaml.YAMLError as e:
                                  print(f"✗ {filepath} - YAML error: {e}")
          PYTHON
